<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNT4848 | SYSTEM PANEL</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #panel-container { border: 1px solid #30363d; padding: 40px; border-radius: 10px; background: #161b22; text-align: center; width: 350px; }
        h2 { color: #f0f6fc; margin-bottom: 20px; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; width: 90%; margin-bottom: 20px; border-radius: 5px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { background: #238636; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background: #2ea043; }
        .stat-box { background: #0d1117; border: 1px solid #30363d; padding: 15px; border-radius: 5px; margin-top: 15px; }
        .stat-label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
        .stat-value { font-size: 28px; font-weight: bold; color: #39ff14; }
        .error-msg { color: #ff7b72; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div id="panel-container">
    <div id="login-section">
        <h2>SYSTEM AUTH</h2>
        <input type="password" id="adminPass" placeholder="ENTER ADMIN_PASSWORD">
        <button id="authBtn" onclick="fetchStats()">INITIALIZE</button>
        <div id="errorText" class="error-msg"></div>
    </div>

    <div id="stats-section" style="display:none;">
        <h2>LIVE METRICS</h2>
        <div class="stat-box">
            <div class="stat-label">Requests (24h)</div>
            <div class="stat-value" id="reqCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Page Views</div>
            <div class="stat-value" id="viewCount">0</div>
        </div>
        <button onclick="location.reload()" style="background:#30363d; margin-top:20px;">LOGOUT</button>
    </div>
</div>

<script>
    async function fetchStats() {
        const password = document.getElementById('adminPass').value;
        const btn = document.getElementById('authBtn');
        const errorMsg = document.getElementById('errorText');
        
        btn.innerText = "CONNECTING...";
        errorMsg.style.display = "none";

        // URL hard-coded for your jdji service
        const RENDER_URL = "https://bbb-api-jdji.onrender.com"; 

        try {
            const response = await fetch(`${RENDER_URL}/api/stats`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('stats-section').style.display = 'block';
                document.getElementById('reqCount').innerText = data.requests || 0;
                document.getElementById('viewCount').innerText = data.pageViews || 0;
            } else {
                const errData = await response.json().catch(() => ({ error: "AUTH FAILED" }));
                alert(errData.error || "INVALID PASSWORD");
                btn.innerText = "INITIALIZE";
            }
        } catch (err) {
            btn.innerText = "INITIALIZE";
            errorMsg.style.display = "block";
            errorMsg.innerText = "CONNECTION FAILED. VISIT THE API URL TO WAKE IT UP.";
        }
    }
</script>
</body>
</html>
