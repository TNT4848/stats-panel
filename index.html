<!DOCTYPE html>
<html>
<head>
    <title>TNT4848 | SYSTEM PANEL</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: 'Segoe UI', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #panel-container { border: 1px solid #30363d; padding: 40px; border-radius: 10px; background: #161b22; text-align: center; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #f0f6fc; letter-spacing: 2px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; width: 80%; margin-bottom: 20px; border-radius: 5px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 88%; }
        button:hover { background: #2ea043; }
        .stats-grid { display: none; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .stat-box { background: #0d1117; border: 1px solid #30363d; padding: 15px; border-radius: 5px; }
        .stat-label { font-size: 10px; color: #8b949e; text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; color: #39ff14; }
    </style>
</head>
<body>

<div id="panel-container">
    <div id="login-section">
        <h2>TERMINAL AUTH</h2>
        <p style="font-size: 12px; color: #8b949e;">ENTER ADMIN_PASSWORD</p>
        <input type="password" id="adminPass" placeholder="••••••••">
        <button onclick="fetchStats()">INITIALIZE</button>
    </div>

    <div id="stats-section" style="display:none;">
        <h2>SYSTEM METRICS</h2>
        <div class="stats-grid" id="grid">
            <div class="stat-box">
                <div class="stat-label">Requests (24h)</div>
                <div class="stat-value" id="reqCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Page Views</div>
                <div class="stat-value" id="viewCount">0</div>
            </div>
        </div>
        <button onclick="location.reload()" style="background:#30363d; margin-top:20px;">LOGOUT</button>
    </div>
</div>

<script>
    async function fetchStats() {
        const password = document.getElementById('adminPass').value;
        const btn = document.querySelector('button');
        btn.innerText = "AUTHENTICATING...";

        try {
            // CHANGE THIS URL TO YOUR ACTUAL RENDER LINK
            const response = await fetch('https://bbb-api.onrender.com/api/stats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('stats-section').style.display = 'block';
                document.getElementById('grid').style.display = 'grid';
                document.getElementById('reqCount').innerText = data.requests || 0;
                document.getElementById('viewCount').innerText = data.pageViews || 0;
            } else {
                alert("INVALID CREDENTIALS");
                btn.innerText = "INITIALIZE";
            }
        } catch (err) {
            alert("CANNOT CONNECT TO API");
            btn.innerText = "INITIALIZE";
        }
    }
</script>

</body>
</html>
